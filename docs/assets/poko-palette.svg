    <text x="14" y="121" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4A4A52">#FFE14D</text>
  </g>

  <!-- 5: Coral -->
  <g transform="translate(692, 56)">
    <rect x="4" y="4" width="148" height="136" rx="14" fill="#111111" />
    <rect x="0" y="0" width="148" height="136" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    <rect x="10" y="10" width="128" height="68" rx="9" fill="#FF6B8B" stroke="#111111" stroke-width="2" />
