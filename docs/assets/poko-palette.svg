    <rect x="4" y="4" width="148" height="136" rx="14" fill="#111111" />
    <rect x="0" y="0" width="148" height="136" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    <rect x="10" y="10" width="128" height="68" rx="9" fill="#5CE1FF" stroke="#111111" stroke-width="2" />
    <text x="14" y="101" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#111111">Sky Cyan</text>
    <text x="14" y="121" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4A4A52">#5CE1FF</text>
  </g>

  <!-- 7: Lavender -->
  <g transform="translate(1024, 56)">
    <rect x="4" y="4" width="148" height="136" rx="14" fill="#111111" />
    <rect x="0" y="0" width="148" height="136" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    <rect x="10" y="10" width="128" height="68" rx="9" fill="#D6B8FF" stroke="#111111" stroke-width="2" />
    <text x="14" y="101" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#111111">Soft Lavender</text>
    <text x="14" y="121" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4A4A52">#D6B8FF</text>
