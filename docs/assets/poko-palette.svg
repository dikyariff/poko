<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Poko Design System — Warm-Paper Neo-Brutalism Color Tokens">
  <rect x="0" y="0" width="1200" height="220" rx="22" fill="#FAF6EC" stroke="#111111" stroke-width="3" />

  <text x="28" y="38" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#111111">COLOR TOKENS · WARM-PAPER NEO-BRUTALISM</text>
  <text x="1172" y="38" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#4A4A52">border: 2.5px solid #111111 · shadow: 4px 4px 0 #111111</text>

  <!-- 7 Swatch Cards -->
  <!-- 1: Canvas -->
  <g transform="translate(28, 56)">
    <rect x="4" y="4" width="148" height="136" rx="14" fill="#111111" />
    <rect x="0" y="0" width="148" height="136" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    <rect x="10" y="10" width="128" height="68" rx="9" fill="#FFFDF5" stroke="#111111" stroke-width="2" />
    <text x="14" y="101" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#111111">Canvas</text>
    <text x="14" y="121" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4A4A52">#FFFDF5</text>
  </g>

  <!-- 2: Ink -->
  <g transform="translate(194, 56)">
    <rect x="4" y="4" width="148" height="136" rx="14" fill="#111111" />
    <rect x="0" y="0" width="148" height="136" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    <rect x="10" y="10" width="128" height="68" rx="9" fill="#111111" stroke="#111111" stroke-width="2" />
    <text x="14" y="101" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#111111">Ink</text>
    <text x="14" y="121" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4A4A52">#111111</text>
  </g>

  <!-- 3: Lime -->
  <g transform="translate(360, 56)">
    <rect x="4" y="4" width="148" height="136" rx="14" fill="#111111" />
    <rect x="0" y="0" width="148" height="136" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    <rect x="10" y="10" width="128" height="68" rx="9" fill="#C8FF3D" stroke="#111111" stroke-width="2" />
    <text x="14" y="101" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#111111">Acid Lime</text>
    <text x="14" y="121" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4A4A52">#C8FF3D</text>
  </g>

  <!-- 4: Yellow -->
  <g transform="translate(526, 56)">
    <rect x="4" y="4" width="148" height="136" rx="14" fill="#111111" />
    <rect x="0" y="0" width="148" height="136" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    <rect x="10" y="10" width="128" height="68" rx="9" fill="#FFE14D" stroke="#111111" stroke-width="2" />
