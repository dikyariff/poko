<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Poko Planner — Kantong rapi, impian pasti">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#111111" fill-opacity="0.10" />
    </pattern>
    <clipPath id="outerClip">
      <rect x="8" y="8" width="1176" height="396" rx="28" />
    </clipPath>
  </defs>

  <!-- Hard Offset Outer Shadow -->
  <rect x="16" y="16" width="1176" height="396" rx="28" fill="#111111" />
  <!-- Main Warm Paper Canvas -->
  <rect x="8" y="8" width="1176" height="396" rx="28" fill="#FFFDF5" stroke="#111111" stroke-width="3.5" />
  <rect x="8" y="8" width="1176" height="396" rx="28" fill="url(#dotGrid)" clip-path="url(#outerClip)" />

  <!-- Decorative Neo-Brutalist Geometric Accents -->
  <g clip-path="url(#outerClip)">
    <!-- Top-right yellow starburst badge -->
    <polygon points="1115,38 1126,62 1152,65 1132,82 1138,108 1115,94 1092,108 1098,82 1078,65 1104,62" fill="#FFE14D" stroke="#111111" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Subtle lavender corner accent -->
    <circle cx="1155" cy="368" r="56" fill="#D6B8FF" stroke="#111111" stroke-width="3" />
    <circle cx="1155" cy="368" r="22" fill="#FFFDF5" stroke="#111111" stroke-width="2.5" />
  </g>

  <!-- LEFT COLUMN: Brand Pill, Title, Tagline, Pills -->
  <g transform="translate(56, 54)">
    <!-- Status Pill -->
    <rect x="3" y="3" width="248" height="34" rx="17" fill="#111111" />
    <rect x="0" y="0" width="248" height="34" rx="17" fill="#C8FF3D" stroke="#111111" stroke-width="2.5" />
    <circle cx="20" cy="17" r="5" fill="#111111" />
    <text x="34" y="22" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="13" font-weight="800" fill="#111111" letter-spacing="0.6">WARM-PAPER NEO-BRUTALISM</text>

    <!-- Brand Title -->
    <text x="0" y="122" font-family="'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" fill="#111111" letter-spacing="-2.5">POKO</text>
    <!-- Highlight Sticker beside POKO -->
    <g transform="translate(248, 66) rotate(-3)">
      <rect x="4" y="4" width="166" height="46" rx="12" fill="#111111" />
      <rect x="0" y="0" width="166" height="46" rx="12" fill="#FFE14D" stroke="#111111" stroke-width="2.8" />
      <text x="83" y="30" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#111111" letter-spacing="0.5">PLANNER</text>
    </g>

    <!-- Tagline -->
    <text x="2" y="168" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#111111">Kantong rapi, impian pasti.</text>

    <!-- Subtitle -->
    <text x="2" y="204" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#4A4A52">Aplikasi pencatatan keuangan pribadi &amp; Dream Planner modern</text>
    <text x="2" y="227" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#4A4A52">dengan Multi-Dompet, Scan Struk AI, Laporan Visual, dan Misi Anti Boncos.</text>

    <!-- Feature Chips Row -->
    <g transform="translate(0, 258)">
      <!-- Chip 1 -->
      <rect x="3" y="3" width="136" height="38" rx="11" fill="#111111" />
      <rect x="0" y="0" width="136" height="38" rx="11" fill="#FFFFFF" stroke="#111111" stroke-width="2.4" />
      <circle cx="18" cy="19" r="6" fill="#C8FF3D" stroke="#111111" stroke-width="1.8" />
      <text x="32" y="24" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#111111">Multi-Dompet</text>

      <!-- Chip 2 -->
      <g transform="translate(150, 0)">
        <rect x="3" y="3" width="144" height="38" rx="11" fill="#111111" />
        <rect x="0" y="0" width="144" height="38" rx="11" fill="#5CE1FF" stroke="#111111" stroke-width="2.4" />
        <text x="72" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#111111">Dream Planner</text>
      </g>

      <!-- Chip 3 -->
      <g transform="translate(308, 0)">
        <rect x="3" y="3" width="140" height="38" rx="11" fill="#111111" />
        <rect x="0" y="0" width="140" height="38" rx="11" fill="#FF6B8B" stroke="#111111" stroke-width="2.4" />
        <text x="70" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#111111">Scan Struk AI</text>
      </g>

      <!-- Chip 4 -->
      <g transform="translate(462, 0)">
        <rect x="3" y="3" width="126" height="38" rx="11" fill="#111111" />
        <rect x="0" y="0" width="126" height="38" rx="11" fill="#D6B8FF" stroke="#111111" stroke-width="2.4" />
        <text x="63" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#111111">Anti Boncos</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Floating Neo-Brutalist Bento Showcase Cards -->
  <g transform="translate(716, 48)">
    <!-- Card 1: Saldo Total Hero Card (Lime) -->
    <rect x="6" y="6" width="388" height="148" rx="20" fill="#111111" />
    <rect x="0" y="0" width="388" height="148" rx="20" fill="#C8FF3D" stroke="#111111" stroke-width="3" />

    <!-- Mini Wallet Emblem inside Card -->
    <g transform="translate(22, 22)">
      <rect x="3" y="3" width="58" height="58" rx="16" fill="#111111" />
      <rect x="0" y="0" width="58" height="58" rx="16" fill="#FFFDF5" stroke="#111111" stroke-width="2.5" />
      <!-- Stylized Neo-Brutalist Wallet Icon -->
      <rect x="13" y="18" width="32" height="24" rx="6" fill="#5CE1FF" stroke="#111111" stroke-width="2.2" />
      <path d="M16 18 L16 15 C16 13.5 17.5 12 19.5 12 L37 12 C39 12 40 13.5 40 15 L40 18" fill="#FFE14D" stroke="#111111" stroke-width="2.2" stroke-linejoin="round" />
      <rect x="31" y="26" width="15" height="9" rx="3.5" fill="#FFFDF5" stroke="#111111" stroke-width="2" />
      <circle cx="36" cy="30.5" r="1.8" fill="#111111" />
    </g>

    <text x="98" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#111111" opacity="0.8">TOTAL SALDO AKTIF</text>
    <text x="98" y="76" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="28" font-weight="800" fill="#111111">Rp 24.750.000</text>

    <!-- Income / Expense Mini Pills -->
    <rect x="22" y="102" width="166" height="30" rx="9" fill="#FFFDF5" stroke="#111111" stroke-width="2" />
    <text x="34" y="121" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0C753B">+Rp 8.500.000</text>

    <rect x="200" y="102" width="166" height="30" rx="9" fill="#FFFDF5" stroke="#111111" stroke-width="2" />
    <text x="212" y="121" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="12.5" font-weight="700" fill="#C51D44">-Rp 1.245.500</text>

    <!-- Card 2: Dream Target Card (White) -->
    <g transform="translate(0, 170)">
      <rect x="6" y="6" width="234" height="142" rx="20" fill="#111111" />
      <rect x="0" y="0" width="234" height="142" rx="20" fill="#FFFFFF" stroke="#111111" stroke-width="3" />

      <rect x="18" y="18" width="98" height="24" rx="8" fill="#5CE1FF" stroke="#111111" stroke-width="2" />
      <text x="67" y="34" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="800" fill="#111111">DREAM TARGET</text>

      <text x="18" y="68" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#111111">MacBook &amp; Studio</text>
      <text x="18" y="92" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13.5" font-weight="700" fill="#4A4A52">Rp 10.800.000 / 15 Jt</text>

      <!-- Progress Bar -->
      <rect x="18" y="106" width="198" height="18" rx="9" fill="#FAF6EC" stroke="#111111" stroke-width="2" />
      <rect x="18" y="106" width="144" height="18" rx="9" fill="#FFE14D" stroke="#111111" stroke-width="2" />
      <text x="188" y="119" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="800" fill="#111111">72%</text>
    </g>

    <!-- Card 3: Anti Boncos Level Card (Yellow/Coral) -->
    <g transform="translate(252, 170)">
      <rect x="6" y="6" width="136" height="142" rx="20" fill="#111111" />
      <rect x="0" y="0" width="136" height="142" rx="20" fill="#FFE14D" stroke="#111111" stroke-width="3" />

      <text x="68" y="34" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="800" fill="#111111">ANTI BONCOS</text>
      <text x="68" y="84" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#111111">Lv.5</text>
      <rect x="18" y="102" width="100" height="24" rx="12" fill="#FF6B8B" stroke="#111111" stroke-width="2" />
      <text x="68" y="118" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="800" fill="#111111">14D STREAK</text>
    </g>
  </g>
</svg>
