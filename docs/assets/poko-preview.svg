  <circle cx="42" cy="37" r="7" fill="#FF6B8B" stroke="#111111" stroke-width="2" />
  <circle cx="66" cy="37" r="7" fill="#FFE14D" stroke="#111111" stroke-width="2" />
  <circle cx="90" cy="37" r="7" fill="#C8FF3D" stroke="#111111" stroke-width="2" />

  <rect x="400" y="23" width="400" height="28" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2" />
